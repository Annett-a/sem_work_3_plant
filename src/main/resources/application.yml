spring:
  profiles:
    default: dev

  mvc:
    throw-exception-if-no-handler-found: true

  application:
    name: sem3

  flyway:
    enabled: true

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/sem3_files}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  perenual:
    apiKey: ${PERENUAL_API_KEY:}

  plantnet:
    apiKey: ${PLANTNET_API_KEY:}
    project: ${PLANTNET_PROJECT:all}
    baseUrl: ${PLANTNET_BASE_URL:https://my-api.plantnet.org}
    lang: ${PLANTNET_LANG:en}
    nbResults: ${PLANTNET_NB_RESULTS:7}

  oauth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:true}
      clientId: ${GOOGLE_OAUTH_CLIENT_ID:}
      clientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirectUri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/auth/oauth/google/callback}
      discoveryUri: ${GOOGLE_OAUTH_DISCOVERY_URI:https://accounts.google.com/.well-known/openid-configuration}
      scope: ${GOOGLE_OAUTH_SCOPE:openid email profile}

server:
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false