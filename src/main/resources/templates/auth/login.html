<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('Вход', '', ~{::main})}">

<main class="container">
    <h1>Вход</h1>
    <p class="muted"
       th:text="${googleOAuthReady}
      ? 'Введите email и пароль или воспользуйтесь входом через Google.'
      : 'Введите email и пароль для входа.'">
        Введите email и пароль для входа.
    </p>

    <div class="alert error" th:if="${param.error != null}">
        Неверные данные для входа
    </div>

    <div class="alert success" th:if="${param.registered != null}">
        Регистрация прошла успешно. Теперь можно войти.
    </div>

    <div class="alert error" th:if="${oauthError != null}" th:text="${oauthError}">
        Ошибка входа через Google
    </div>

    <form method="post" th:action="@{/auth/login}" class="card u-p-14 u-mt-12 u-max-w-520">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label class="field">
            <span class="field__label">Email</span>
            <input class="input" type="text" name="username" placeholder="email@example.com" required>
        </label>

        <label class="field u-mt-12">
            <span class="field__label">Пароль</span>
            <input class="input" type="password" name="password" required>
        </label>

        <div class="u-mt-12 u-flex u-gap-10 u-flex-wrap">
            <button class="btn primary" type="submit">Войти</button>
            <a class="btn" th:href="@{/auth/register}">Регистрация</a>
        </div>

        <div th:if="${googleOAuthReady}" class="u-mt-16">
            <a class="btn" th:href="@{/auth/oauth/google}">
                Войти через Google
            </a>
        </div>
    </form>
</main>
</html>
