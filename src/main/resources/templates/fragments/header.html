<header class="nav"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        th:fragment="header">

    <div>
        <a th:href="@{/}">Главная</a>

        <span sec:authorize="isAuthenticated()">
        <a th:href="@{/app}">Личный кабинет</a>
        <a th:href="@{/app/plants}">Мои растения</a>
        <a th:href="@{/app/today}">Сегодня нужно</a>
    </span>

        <a th:href="@{/app/species}">Каталог видов</a>
        <a th:href="@{/app/species/suitable}">Подбор по условиям</a>

        <span sec:authorize="isAuthenticated()">
            <a th:href="@{/app/species/top-capricious}">Топ капризных</a>
            <a th:href="@{/app/identify/ajax}">Распознавание по фото</a>
    </span>

        <span sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin}">Админ</a>
    </span>
    </div>

    <div>
        <span sec:authorize="isAnonymous()">
            <a class="btn btn-ghost btn-inline" th:href="@{/auth/login}">Вход</a>
            <a class="btn btn-primary btn-inline" th:href="@{/auth/register}">Регистрация</a>
            <a class="btn btn-ghost btn-inline"
               th:if="${googleOAuthReady}"
               th:href="@{/auth/oauth/google}">Войти через Google</a>
</span>

        <span sec:authorize="isAuthenticated()">
            <span class="badge" th:text="${#authentication.name}">user</span>
            <form th:action="@{/logout}" method="post" class="u-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-ghost btn-inline" type="submit">Выйти</button>
            </form>
        </span>
    </div>

</header>
