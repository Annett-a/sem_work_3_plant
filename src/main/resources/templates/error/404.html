<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout('404 — Страница не найдена', '', ~{::main})}">

<main class="container error-page">
    <section class="card error-hero">
        <span class="badge error-hero__badge">404</span>
        <h1 class="error-page__title">Страница не найдена</h1>
        <p class="muted error-page__subtitle">
            Адрес не найден:
            <span th:text="${path}">/</span>
        </p>
    </section>

    <section class="card error-card">
        <p class="muted error-card__text">
            Возможно, ссылка устарела или в адресе есть опечатка.
        </p>

        <div class="error-actions">
            <a class="btn btn-primary" th:href="@{/}">На главную</a>
            <a class="btn"
               th:href="${backUrl != null and !#strings.isEmpty(backUrl) ? backUrl : '/'}">Назад</a>
        </div>
    </section>
</main>

</html>
